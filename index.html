<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#2a1f3d">
<title>Каптер: 9 Жизней</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    height:100%; overflow:hidden;
    background:#2a1f3d;
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    touch-action:none; user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  #game { display:block; width:100vw; height:100vh; }
  #hud {
    position:fixed; top:0; left:0; right:0;
    padding:10px 14px; color:#fff;
    display:flex; justify-content:space-between; align-items:center;
    font-size:17px; font-weight:800;
    text-shadow:0 2px 6px rgba(0,0,0,.6);
    pointer-events:none; z-index:10; gap:10px;
  }
  #avatar {
    width:52px; height:52px;
    border-radius:50%;
    border:2px solid #ffb37a;
    box-shadow:0 2px 8px rgba(0,0,0,.5);
    background:#3a2a45;
    display:block;
  }
  #lives { letter-spacing:1px; font-size:15px; }
  #lives .lost { opacity:.2; }
  #score { font-variant-numeric:tabular-nums; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <canvas id="avatar" width="104" height="104"></canvas>
  <div id="lives"></div>
  <div id="score">0</div>
</div>
<script>
(() => {
'use strict';

// ═══════════════════════════════════════════
//  ПАЛИТРА КОТА (подобрана под твоё фото)
// ═══════════════════════════════════════════
const C = {
  FUR:       '#94876b',  // основной серо-коричневый мех
  FUR_DARK:  '#4f4534',  // тёмные полоски
  FUR_LIGHT: '#aaa08a',  // светлые участки
  WHITE:     '#faf5eb',  // грудка, носочки, морда
  PINK:      '#e08a8a',  // нос
  EAR_PINK:  '#e8a5a5',  // внутренние уши
  EYE:       '#c8d15a',  // жёлто-зелёная радужка
  EYE_DARK:  '#1a1a12',  // зрачок
  CLAW:      '#3a3226',  // коготки
};

// ═══════════════════════════════════════════
//  CANVAS
// ═══════════════════════════════════════════
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, groundY = 0, DPR = 1;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  groundY = H - 96;
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));
resize();

// ═══════════════════════════════════════════
//  КОНСТАНТЫ
// ═══════════════════════════════════════════
const GRAVITY = 0.95;
const JUMP_V = -16.5;
const MAX_JUMPS = 2;
const CAT_W = 110;
const CAT_H = 110;

// ═══════════════════════════════════════════
//  СОСТОЯНИЕ
// ═══════════════════════════════════════════
const G = {
  started:false, dead:false, t:0,
  distance:0, score:0, speed:6, lives:9,
  obstacles:[], items:[], particles:[],
  spawnTimer:70, shake:0, invuln:0, bgOffset:0,
};

const cat = {
  x:0, y:0, vy:0, jumps:0,
  sliding:false, slideTimer:0,
  rot:0, sx:1, sy:1,
};

let blinkTimer = 0;
let nextBlink = 90;
let earTwitch = 0;
let nextEarTwitch = 60;

// ═══════════════════════════════════════════
//  RESET
// ═══════════════════════════════════════════
function resetGame() {
  G.started = true; G.dead = false; G.t = 0;
  G.distance = 0; G.score = 0; G.speed = 6; G.lives = 9;
  G.obstacles = []; G.items = []; G.particles = [];
  G.spawnTimer = 70; G.shake = 0; G.invuln = 0;
  cat.x = Math.max(100, W * 0.22);
  cat.y = groundY; cat.vy = 0; cat.jumps = 0;
  cat.sliding = false; cat.slideTimer = 0;
  cat.rot = 0; cat.sx = 1; cat.sy = 1;
  blinkTimer = 0; nextBlink = 90;
  earTwitch = 0; nextEarTwitch = 60;
  updateHUD();
}

// ═══════════════════════════════════════════
//  УПРАВЛЕНИЕ
// ═══════════════════════════════════════════
function jump() {
  if (!G.started || G.dead) return;
  if (cat.jumps < MAX_JUMPS) {
    cat.vy = cat.jumps === 0 ? JUMP_V : JUMP_V * 0.85;
    cat.jumps++;
    cat.sliding = false; cat.slideTimer = 0;
    burst(cat.x, cat.y - 20, '#fff', 6, 1.5);
  }
}

function slide() {
  if (!G.started || G.dead) return;
  cat.sliding = true; cat.slideTimer = 26;
  if (cat.y < groundY - 2) cat.vy = Math.max(cat.vy, 8);
}

let touchY = 0, touchX = 0, touchT = 0;

canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  const t = e.changedTouches[0];
  touchX = t.clientX; touchY = t.clientY; touchT = performance.now();
}, { passive:false });

canvas.addEventListener('touchend', (e) => {
  e.preventDefault();
  const t = e.changedTouches[0];
  const dy = t.clientY - touchY;
  const dx = Math.abs(t.clientX - touchX);
  const dt = performance.now() - touchT;
  if (!G.started || G.dead) { resetGame(); return; }
  if (dy > 36 && dy > dx && dt < 500) slide();
  else jump();
}, { passive:false });

canvas.addEventListener('mousedown', () => {
  if (!G.started || G.dead) resetGame(); else jump();
});

window.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
    e.preventDefault();
    if (!G.started || G.dead) resetGame(); else jump();
  }
  if (e.code === 'ArrowDown' || e.code === 'KeyS') {
    e.preventDefault(); slide();
  }
});

// ═══════════════════════════════════════════
//  ХЕЛПЕРЫ
// ═══════════════════════════════════════════
function roundRect(c, x, y, w, h, r) {
  r = Math.min(r, w/2, h/2);
  c.beginPath();
  c.moveTo(x+r, y);
  c.arcTo(x+w, y, x+w, y+h, r);
  c.arcTo(x+w, y+h, x, y+h, r);
  c.arcTo(x, y+h, x, y, r);
  c.arcTo(x, y, x+w, y, r);
  c.closePath();
}

function burst(x, y, color, n, power) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = Math.random() * power + 1;
    G.particles.push({
      x, y,
      vx: Math.cos(a)*s, vy: Math.sin(a)*s - 1,
      life: 30 + Math.random()*20, maxLife: 50,
      color, r: 2 + Math.random()*3,
    });
  }
}

function updateHUD() {
  const el = document.getElementById('lives');
  let html = '';
  for (let i = 0; i < 9; i++)
    html += i < G.lives ? '🐾' : '<span class="lost">🐾</span>';
  el.innerHTML = html;
  document.getElementById('score').textContent =
    String(G.score).padStart(4, '0');
}

function getBlink() {
  if (blinkTimer <= 0) return 0;
  const p = 1 - blinkTimer / 8;
  return Math.sin(p * Math.PI);
}

// ═══════════════════════════════════════════
//  СПАВН
// ═══════════════════════════════════════════
function spawnObstacle() {
  const r = Math.random();
  let o;
  if      (r < 0.30) o = { type:'box',     w:52, h:48, y:groundY-48 };
  else if (r < 0.55) o = { type:'pepper',  w:34, h:28, y:groundY-28 };
  else if (r < 0.78) o = { type:'vacuum',  w:64, h:34, y:groundY-34 };
  else               o = { type:'slipper', w:52, h:36, y:groundY-70 };
  o.x = W + 40;
  G.obstacles.push(o);

  if (Math.random() < 0.55) {
    const high = Math.random() < 0.5;
    G.items.push({
      x: W + 90 + Math.random()*120,
      y: high ? groundY - 130 : groundY - 48,
      r: 13, collected: false,
    });
  }
}

// ═══════════════════════════════════════════
//  UPDATE
// ═══════════════════════════════════════════
function update(dt) {
  G.t += dt;
  G.bgOffset += G.speed * dt * 0.35;

  // мигание
  if (blinkTimer > 0) blinkTimer -= dt;
  else {
    nextBlink -= dt;
    if (nextBlink <= 0) {
      blinkTimer = 8;
      nextBlink = 90 + Math.random() * 240;
    }
  }
  // подёргивание уха
  if (earTwitch > 0) earTwitch -= dt;
  else {
    nextEarTwitch -= dt;
    if (nextEarTwitch <= 0) {
      earTwitch = 12;
      nextEarTwitch = 180 + Math.random() * 300;
    }
  }

  if (!G.started || G.dead) { updateParticles(dt); return; }

  G.distance += G.speed * dt;
  G.speed = Math.min(6 + G.distance * 0.0005, 16);
  G.score = Math.floor(G.distance / 8);

  cat.vy += GRAVITY * dt;
  cat.y  += cat.vy * dt;
  if (cat.y >= groundY) {
    cat.y = groundY; cat.vy = 0; cat.jumps = 0;
  }

  const airborne = cat.y < groundY - 2;
  const targetRot = airborne
    ? Math.max(-0.22, Math.min(0.22, cat.vy * 0.014))
    : Math.sin(G.t * 0.5) * 0.025;
  cat.rot += (targetRot - cat.rot) * 0.15 * dt;

  const targetSY = cat.sliding ? 0.62 : (airborne ? 1.06 : 1);
  const targetSX = cat.sliding ? 1.20 : (airborne ? 0.95 : 1);
  cat.sy += (targetSY - cat.sy) * 0.22 * dt;
  cat.sx += (targetSX - cat.sx) * 0.22 * dt;

  if (cat.slideTimer > 0) {
    cat.slideTimer -= dt;
    if (cat.slideTimer <= 0) cat.sliding = false;
  }
  if (G.invuln > 0) G.invuln -= dt;

  G.spawnTimer -= dt;
  if (G.spawnTimer <= 0) {
    spawnObstacle();
    const base = Math.max(42, 105 - G.speed * 5.5);
    G.spawnTimer = base + Math.random() * 45;
  }

  const dx = G.speed * dt;
  for (let i = G.obstacles.length - 1; i >= 0; i--) {
    const o = G.obstacles[i];
    o.x -= dx;
    if (o.x + o.w < -60) G.obstacles.splice(i, 1);
  }
  for (let i = G.items.length - 1; i >= 0; i--) {
    const it = G.items[i];
    it.x -= dx;
    if (it.x < -60) G.items.splice(i, 1);
  }

  const hbW = cat.sliding ? CAT_W * 0.70 : CAT_W * 0.48;
  const hbH = cat.sliding ? CAT_H * 0.30 : CAT_H * 0.60;
  const hb = { x: cat.x - hbW/2, y: cat.y - hbH, w: hbW, h: hbH };

  if (G.invuln <= 0) {
    for (const o of G.obstacles) {
      if (hb.x < o.x + o.w && hb.x + hb.w > o.x &&
          hb.y < o.y + o.h && hb.y + hb.h > o.y) {
        hit(); break;
      }
    }
  }

  for (const it of G.items) {
    if (it.collected) continue;
    const cx = hb.x + hb.w/2, cy = hb.y + hb.h/2;
    if (Math.hypot(cx - it.x, cy - it.y) < it.r + 32) {
      it.collected = true;
      G.distance += 120;
      burst(it.x, it.y, '#f4b942', 8, 2.5);
    }
  }
  G.items = G.items.filter(i => !i.collected);

  updateParticles(dt);
  if (G.shake > 0) G.shake -= dt;
  updateHUD();
}

function hit() {
  G.lives--; G.invuln = 100; G.shake = 18;
  burst(cat.x, cat.y - 30, '#ff5a5a', 14, 3);
  updateHUD();
  if (G.lives <= 0) { G.dead = true; G.lives = 0; updateHUD(); }
}

function updateParticles(dt) {
  for (let i = G.particles.length - 1; i >= 0; i--) {
    const p = G.particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 0.35 * dt;
    p.life -= dt;
    if (p.life <= 0) G.particles.splice(i, 1);
  }
}

// ═══════════════════════════════════════════
//  ФОН
// ═══════════════════════════════════════════
function drawBackground() {
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#2a1f3d');
  grad.addColorStop(0.55, '#4a2f45');
  grad.addColorStop(1, '#6b3f3a');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.globalAlpha = 0.12;
  ctx.fillStyle = '#ffb37a';
  const off = G.bgOffset * 0.25;
  for (let i = 0; i < 8; i++) {
    const bx = ((i*220 - off) % (W + 400)) - 200;
    const bh = 90 + (i % 3) * 45;
    roundRect(ctx, bx, groundY - bh - 40, 130, bh, 10);
    ctx.fill();
  }
  ctx.restore();

  ctx.save();
  ctx.globalAlpha = 0.08;
  ctx.fillStyle = '#000';
  const off2 = G.bgOffset * 0.6;
  for (let i = 0; i < 12; i++) {
    const bx = ((i*160 - off2) % (W + 320)) - 160;
    ctx.fillRect(bx, groundY - 60, 8, 60);
  }
  ctx.restore();
}

function drawGround() {
  const g = ctx.createLinearGradient(0, groundY, 0, H);
  g.addColorStop(0, '#7a4a34');
  g.addColorStop(1, '#4a2a1e');
  ctx.fillStyle = g;
  ctx.fillRect(0, groundY, W, H - groundY);

  ctx.fillStyle = '#a86a44';
  ctx.fillRect(0, groundY, W, 5);

  ctx.save();
  ctx.globalAlpha = 0.18;
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 2;
  const off = G.bgOffset % 90;
  for (let x = -off; x < W + 90; x += 90) {
    ctx.beginPath();
    ctx.moveTo(x, groundY + 8);
    ctx.lineTo(x - 30, H);
    ctx.stroke();
  }
  ctx.restore();
}

// ═══════════════════════════════════════════
//  ПРЕПЯТСТВИЯ
// ═══════════════════════════════════════════
function drawObstacle(o) {
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.22)';
  ctx.beginPath();
  ctx.ellipse(o.x + o.w/2, groundY + 3, o.w*0.5, 5, 0, 0, Math.PI*2);
  ctx.fill();

  if (o.type === 'box') {
    ctx.fillStyle = '#c94a1e';
    roundRect(ctx, o.x, o.y + 3, o.w, o.h, 7); ctx.fill();
    ctx.fillStyle = '#e35d2a';
    roundRect(ctx, o.x, o.y, o.w, o.h, 7); ctx.fill();
    ctx.fillStyle = '#ff8a55';
    roundRect(ctx, o.x+4, o.y+4, o.w-8, o.h*0.32, 4); ctx.fill();
    ctx.fillStyle = '#a83a14';
    ctx.fillRect(o.x+7, o.y + o.h*0.55, o.w-14, 3);
  } else if (o.type === 'pepper') {
    ctx.fillStyle = '#3f7a30';
    ctx.beginPath();
    ctx.ellipse(o.x+o.w/2+1, o.y+o.h/2+2, o.w/2, o.h/2, -0.35, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#5aa83f';
    ctx.beginPath();
    ctx.ellipse(o.x+o.w/2, o.y+o.h/2, o.w/2, o.h/2, -0.35, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#8fd96a';
    ctx.beginPath();
    ctx.ellipse(o.x+o.w/2-4, o.y+o.h/2-4, o.w/5, o.h/6, -0.35, 0, Math.PI*2);
    ctx.fill();
  } else if (o.type === 'vacuum') {
    ctx.fillStyle = '#23232c';
    roundRect(ctx, o.x, o.y, o.w, o.h, o.h/2); ctx.fill();
    ctx.fillStyle = '#3a3a4a';
    roundRect(ctx, o.x+4, o.y+4, o.w-8, o.h-10, (o.h-10)/2); ctx.fill();
    ctx.fillStyle = '#6a6a85';
    ctx.beginPath();
    ctx.arc(o.x+o.w/2, o.y+o.h/2, o.h*0.26, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#ff4a4a';
    ctx.beginPath();
    ctx.arc(o.x+o.w/2, o.y+o.h*0.32, 3, 0, Math.PI*2);
    ctx.fill();
  } else if (o.type === 'slipper') {
    ctx.fillStyle = '#8c3e3a';
    ctx.beginPath();
    ctx.ellipse(o.x+o.w/2+2, o.y+o.h/2+3, o.w/2, o.h/2, -0.2, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#b8544f';
    ctx.beginPath();
    ctx.ellipse(o.x+o.w/2, o.y+o.h/2, o.w/2, o.h/2, -0.2, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#d97070';
    ctx.beginPath();
    ctx.ellipse(o.x+o.w/2-8, o.y+o.h/2-2, o.w/3.5, o.h/3.5, -0.2, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
}

// ═══════════════════════════════════════════
//  РЫБКА
// ═══════════════════════════════════════════
function drawFish(it) {
  ctx.save();
  ctx.translate(it.x, it.y);
  const bob = Math.sin(G.t * 0.09 + it.x * 0.02) * 3;
  ctx.translate(0, bob);

  ctx.globalAlpha = 0.25;
  ctx.fillStyle = '#ffd66b';
  ctx.beginPath();
  ctx.arc(0, 0, it.r * 1.8, 0, Math.PI*2);
  ctx.fill();
  ctx.globalAlpha = 1;

  const r = it.r;
  ctx.fillStyle = '#e0a52e';
  ctx.beginPath();
  ctx.moveTo(-r*0.8, 0);
  ctx.lineTo(-r*1.6, -r*0.7);
  ctx.lineTo(-r*1.6, r*0.7);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = '#f4b942';
  ctx.beginPath();
  ctx.ellipse(0, 0, r, r*0.68, 0, 0, Math.PI*2);
  ctx.fill();

  ctx.fillStyle = '#ffe08a';
  ctx.beginPath();
  ctx.ellipse(0, -r*0.15, r*0.6, r*0.25, 0, 0, Math.PI*2);
  ctx.fill();

  ctx.fillStyle = '#2b2b1e';
  ctx.beginPath();
  ctx.arc(r*0.45, -r*0.1, r*0.14, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
}

// ═══════════════════════════════════════════
//  ГЛАВНЫЙ РЕНДЕР КОТА
// ═══════════════════════════════════════════
function drawCat() {
  const cx = cat.x;
  const by = cat.y;
  const t  = G.t;
  const airborne = cat.y < groundY - 2;

  if (G.invuln > 0 && Math.floor(t/4) % 2 === 0) return;

  // Тень
  ctx.fillStyle = 'rgba(0,0,0,0.30)';
  ctx.beginPath();
  const shScale = Math.max(0.4, 1 - (groundY - by)/400);
  ctx.ellipse(cx, groundY + 5, CAT_W*0.40*shScale, 7*shScale, 0, 0, Math.PI*2);
  ctx.fill();

  ctx.save();
  ctx.translate(cx, by);

  // bob
  const bob = (!airborne && !cat.sliding) ? Math.sin(t * 0.55) * 2.5 : 0;
  ctx.translate(0, bob);

  ctx.rotate(cat.rot);
  ctx.scale(cat.sx, cat.sy);
  ctx.translate(5, 0); // центрируем относительно хитбокса

  drawCatBody(t, airborne, cat.sliding);

  ctx.restore();
}

// ─── ТЕЛО КОТА ───
function drawCatBody(t, airborne, sliding) {
  // Пропорции
  const bodyTop = -78;
  const bodyBot = -34;
  const bodyL   = -38;
  const bodyR   = 32;
  const bodyCX  = (bodyL + bodyR) / 2;
  const bodyCY  = (bodyTop + bodyBot) / 2;
  const bodyRW  = (bodyR - bodyL) / 2;
  const bodyRH  = (bodyBot - bodyTop) / 2;

  const legPhase = t * 0.42;

  // 1. Дальние лапы
  if (airborne) {
    drawLeg(-22, -44, -14, 0, 0, C.FUR_DARK);
    drawLeg( 14, -44, -10, 0, 0, C.FUR_DARK);
  } else if (sliding) {
    drawLeg(-26, -30, -8, 0, 0, C.FUR_DARK);
    drawLeg(  8, -30, -8, 0, 0, C.FUR_DARK);
  } else {
    drawLeg(-24, bodyBot, 0, legPhase, 1, C.FUR_DARK);
    drawLeg( 12, bodyBot, 0, legPhase + Math.PI, 1, C.FUR_DARK);
  }

  // 2. Хвост (за телом)
  drawTail(t, airborne, sliding);

  // 3. Тело
  ctx.fillStyle = C.FUR;
  ctx.beginPath();
  ctx.ellipse(bodyCX, bodyCY, bodyRW, bodyRH, 0, 0, Math.PI*2);
  ctx.fill();

  // Полоски на теле
  ctx.save();
  ctx.beginPath();
  ctx.ellipse(bodyCX, bodyCY, bodyRW, bodyRH, 0, 0, Math.PI*2);
  ctx.clip();
  ctx.strokeStyle = C.FUR_DARK;
  ctx.lineWidth = 4;
  ctx.lineCap = 'round';
  for (let i = 0; i < 4; i++) {
    const sx = bodyL + 10 + i * 14;
    ctx.beginPath();
    ctx.moveTo(sx, bodyTop);
    ctx.quadraticCurveTo(sx + 4, bodyCY, sx - 2, bodyBot);
    ctx.stroke();
  }
  ctx.restore();

  // Белая грудка / живот (справа-снизу)
  ctx.fillStyle = C.WHITE;
  ctx.beginPath();
  ctx.ellipse(bodyR - 6, bodyCY + 8, bodyRW * 0.44, bodyRH * 0.55, -0.15, 0, Math.PI*2);
  ctx.fill();

  // 4. Ближние лапы
  if (airborne) {
    drawLeg(-14, -42, -12, 0, 0, C.FUR);
    drawLeg( 20, -42, -8, 0, 0, C.FUR);
  } else if (sliding) {
    drawLeg(-16, -30, -8, 0, 0, C.FUR);
    drawLeg( 20, -30, -8, 0, 0, C.FUR);
  } else {
    drawLeg(-14, bodyBot, 0, legPhase + Math.PI, 0, C.FUR);
    drawLeg( 20, bodyBot, 0, legPhase, 0, C.FUR);
  }

  // 5. Голова
  drawHead(42, -86, 20, t);
}

// ─── ЛАПА ───
function drawLeg(x, yTop, yBot, phase, isFar, color) {
  const swing = Math.sin(phase) * 7;
  const lift  = Math.max(0, Math.sin(phase)) * 4;

  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = isFar ? 8 : 10;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  const midX = x + swing * 0.4;
  const midY = (yTop + yBot) / 2;
  const endX = x + swing;
  const endY = yBot - lift;

  ctx.beginPath();
  ctx.moveTo(x, yTop);
  ctx.lineTo(midX, midY);
  ctx.lineTo(endX, endY);
  ctx.stroke();

  // Белый носочек
  ctx.fillStyle = C.WHITE;
  ctx.beginPath();
  ctx.ellipse(endX, endY, 7, 4, 0, 0, Math.PI*2);
  ctx.fill();

  // Коготки (видны только если лапа в воздухе)
  if (lift > 1) {
    ctx.strokeStyle = C.CLAW;
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let k = -1; k <= 1; k++) {
      ctx.moveTo(endX + k * 2, endY + 1);
      ctx.lineTo(endX + k * 2 + 1, endY + 4);
    }
    ctx.stroke();
  }

  ctx.restore();
}

// ─── ХВОСТ ───
function drawTail(t, airborne, sliding) {
  const rootX = -38;
  const rootY = sliding ? -40 : -70;
  const baseAngle = airborne ? -1.35 : (sliding ? -0.7 : -0.85);
  const segCount = 8;
  const segLen = 11;
  const wagSpeed = 0.25;
  const wagAmp = airborne ? 0.6 : 0.45;

  ctx.save();
  ctx.strokeStyle = C.FUR;
  ctx.lineWidth = 14;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  const points = [[rootX, rootY]];
  let px = rootX, py = rootY;

  ctx.beginPath();
  ctx.moveTo(px, py);
  for (let i = 1; i <= segCount; i++) {
    const seg = i / segCount;
    const a = baseAngle
      + Math.sin(t * wagSpeed - seg * 1.5) * wagAmp * seg;
    const nx = px + Math.cos(a) * segLen;
    const ny = py + Math.sin(a) * segLen;
    ctx.lineTo(nx, ny);
    px = nx; py = ny;
    points.push([px, py]);
  }
  ctx.stroke();

  // Тёмные кольца
  ctx.strokeStyle = C.FUR_DARK;
  ctx.lineWidth = 3.5;
  for (let i = 2; i < points.length - 1; i += 2) {
    const [x1, y1] = points[i];
    const [x2, y2] = points[i + 1] || points[i];
    const a = Math.atan2(y2 - y1, x2 - x1);
    const px2 = x1 + Math.cos(a + Math.PI/2) * 6;
    const py2 = y1 + Math.sin(a + Math.PI/2) * 6;
    const px3 = x1 - Math.cos(a + Math.PI/2) * 6;
    const py3 = y1 - Math.sin(a + Math.PI/2) * 6;
    ctx.beginPath();
    ctx.moveTo(px2, py2);
    ctx.lineTo(px3, py3);
    ctx.stroke();
  }

  // Белый кончик
  const [endX, endY] = points[points.length - 1];
  ctx.fillStyle = C.WHITE;
  ctx.beginPath();
  ctx.arc(endX, endY, 8, 0, Math.PI*2);
  ctx.fill();

  ctx.restore();
}

// ─── ГОЛОВА ───
function drawHead(cx, cy, r, t) {
  // подёргивание уха
  const twitch = earTwitch > 0
    ? Math.sin((1 - earTwitch/12) * Math.PI * 3) * 0.12
    : 0;
  const headBob = Math.sin(t * 0.55) * 1.2;

  ctx.save();
  ctx.translate(0, headBob);

  // ─── УШИ ───
  // левое
  ctx.save();
  ctx.translate(cx - 12, cy - 18);
  ctx.rotate(twitch * 0.8);
  ctx.translate(-(cx - 12), -(cy - 18));
  ctx.fillStyle = C.FUR;
  ctx.beginPath();
  ctx.moveTo(cx - 17, cy - 6);
  ctx.lineTo(cx - 15, cy - 32);
  ctx.lineTo(cx - 1, cy - 14);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = C.EAR_PINK;
  ctx.beginPath();
  ctx.moveTo(cx - 14, cy - 11);
  ctx.lineTo(cx - 13, cy - 27);
  ctx.lineTo(cx - 4, cy - 14);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  // правое (подёргивается сильнее)
  ctx.save();
  ctx.translate(cx + 10, cy - 18);
  ctx.rotate(twitch);
  ctx.translate(-(cx + 10), -(cy - 18));
  ctx.fillStyle = C.FUR;
  ctx.beginPath();
  ctx.moveTo(cx + 3, cy - 14);
  ctx.lineTo(cx + 14, cy - 32);
  ctx.lineTo(cx + 17, cy - 6);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = C.EAR_PINK;
  ctx.beginPath();
  ctx.moveTo(cx + 6, cy - 13);
  ctx.lineTo(cx + 13, cy - 27);
  ctx.lineTo(cx + 14, cy - 11);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  // ─── ГОЛОВА ───
  ctx.fillStyle = C.FUR;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI*2);
  ctx.fill();

  // Полоски на лбу
  ctx.strokeStyle = C.FUR_DARK;
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(cx - 6, cy - r + 4); ctx.lineTo(cx - 6, cy - r + 12);
  ctx.moveTo(cx,     cy - r + 2); ctx.lineTo(cx,     cy - r + 12);
  ctx.moveTo(cx + 6, cy - r + 4); ctx.lineTo(cx + 6, cy - r + 12);
  ctx.stroke();

  // Белая мордашка
  ctx.fillStyle = C.WHITE;
  ctx.beginPath();
  ctx.ellipse(cx + 2, cy + 8, 13, 9, 0, 0, Math.PI*2);
  ctx.fill();

  // ─── ГЛАЗА ───
  const blinkAmt = getBlink();
  const eyeY = cy - 2;
  const eyeLX = cx - 7;
  const eyeRX = cx + 7;
  const eyeR = 6;

  if (blinkAmt > 0.3) {
    ctx.strokeStyle = C.EYE_DARK;
    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(eyeLX - 5, eyeY); ctx.lineTo(eyeLX + 5, eyeY);
    ctx.moveTo(eyeRX - 5, eyeY); ctx.lineTo(eyeRX + 5, eyeY);
    ctx.stroke();
  } else {
    // Радужка
    ctx.fillStyle = C.EYE;
    ctx.beginPath();
    ctx.arc(eyeLX, eyeY, eyeR, 0, Math.PI*2);
    ctx.arc(eyeRX, eyeY, eyeR, 0, Math.PI*2);
    ctx.fill();

    // Зрачок (сужается при моргании)
    ctx.fillStyle = C.EYE_DARK;
    const pupilH = eyeR * 1.7 * (1 - blinkAmt * 0.7);
    ctx.beginPath();
    ctx.ellipse(eyeLX, eyeY, eyeR * 0.55, pupilH / 2, 0, 0, Math.PI*2);
    ctx.ellipse(eyeRX, eyeY, eyeR * 0.55, pupilH / 2, 0, 0, Math.PI*2);
    ctx.fill();

    // Блики
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(eyeLX - 2, eyeY - 2.5, 1.8, 0, Math.PI*2);
    ctx.arc(eyeRX - 2, eyeY - 2.5, 1.8, 0, Math.PI*2);
    ctx.fill();
  }

  // ─── НОС ───
  ctx.fillStyle = C.PINK;
  ctx.beginPath();
  ctx.moveTo(cx + 2, cy + 5);
  ctx.lineTo(cx + 7, cy + 5);
  ctx.lineTo(cx + 4.5, cy + 8);
  ctx.closePath();
  ctx.fill();

  // ─── РОТ ───
  ctx.strokeStyle = C.EYE_DARK;
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(cx + 4.5, cy + 8);
  ctx.lineTo(cx + 4.5, cy + 10);
  ctx.quadraticCurveTo(cx + 1, cy + 12, cx - 1, cy + 10);
  ctx.moveTo(cx + 4.5, cy + 10);
  ctx.quadraticCurveTo(cx + 8, cy + 12, cx + 10, cy + 10);
  ctx.stroke();

  // ─── УСЫ ───
  ctx.strokeStyle = 'rgba(255,255,255,0.9)';
  ctx.lineWidth = 1.2;
  ctx.lineCap = 'round';
  ctx.beginPath();
  // слева
  ctx.moveTo(cx - 10, cy + 6); ctx.lineTo(cx - 26, cy + 2);
  ctx.moveTo(cx - 10, cy + 8); ctx.lineTo(cx - 26, cy + 10);
  // справа
  ctx.moveTo(cx + 14, cy + 6); ctx.lineTo(cx + 30, cy + 2);
  ctx.moveTo(cx + 14, cy + 8); ctx.lineTo(cx + 30, cy + 10);
  ctx.stroke();

  ctx.restore();
}

// ═══════════════════════════════════════════
//  ЧАСТИЦЫ
// ═══════════════════════════════════════════
function drawParticles() {
  for (const p of G.particles) {
    ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// ═══════════════════════════════════════════
//  АВАТАРКА В HUD (рисуем кота один раз)
// ═══════════════════════════════════════════
function drawAvatar() {
  const av = document.getElementById('avatar');
  const c = av.getContext('2d');
  c.setTransform(2, 0, 0, 2, 0, 0); // retina

  c.fillStyle = '#3a2a45';
  c.fillRect(0, 0, 52, 52);

  // морда кота крупным планом
  c.save();
  c.translate(26, 30);
  c.scale(0.95, 0.95);

  // уши
  c.fillStyle = C.FUR;
  c.beginPath();
  c.moveTo(-12, -8); c.lineTo(-11, -26); c.lineTo(0, -12); c.closePath(); c.fill();
  c.beginPath();
  c.moveTo(4, -12); c.lineTo(13, -26); c.lineTo(14, -8); c.closePath(); c.fill();
  c.fillStyle = C.EAR_PINK;
  c.beginPath();
  c.moveTo(-10, -12); c.lineTo(-9, -22); c.lineTo(-2, -13); c.closePath(); c.fill();
  c.beginPath();
  c.moveTo(6, -13); c.lineTo(12, -22); c.lineTo(12, -12); c.closePath(); c.fill();

  // голова
  c.fillStyle = C.FUR;
  c.beginPath(); c.arc(0, 0, 15, 0, Math.PI*2); c.fill();

  // полоски
  c.strokeStyle = C.FUR_DARK; c.lineWidth = 2.5; c.lineCap = 'round';
  c.beginPath();
  c.moveTo(-5, -14); c.lineTo(-5, -7);
  c.moveTo(0, -15); c.lineTo(0, -7);
  c.moveTo(5, -14); c.lineTo(5, -7);
  c.stroke();

  // мордашка
  c.fillStyle = C.WHITE;
  c.beginPath(); c.ellipse(0, 7, 10, 7, 0, 0, Math.PI*2); c.fill();

  // глаза
  c.fillStyle = C.EYE;
  c.beginPath();
  c.arc(-5, -1, 4, 0, Math.PI*2);
  c.arc(5, -1, 4, 0, Math.PI*2);
  c.fill();
  c.fillStyle = C.EYE_DARK;
  c.beginPath();
  c.ellipse(-5, -1, 2.2, 3.4, 0, 0, Math.PI*2);
  c.ellipse(5, -1, 2.2, 3.4, 0, 0, Math.PI*2);
  c.fill();
  c.fillStyle = '#fff';
  c.beginPath();
  c.arc(-6, -2.5, 1.3, 0, Math.PI*2);
  c.arc(4, -2.5, 1.3, 0, Math.PI*2);
  c.fill();

  // нос
  c.fillStyle = C.PINK;
  c.beginPath();
  c.moveTo(-1, 4); c.lineTo(3, 4); c.lineTo(1, 6.5); c.closePath(); c.fill();

  c.restore();
}

// ═══════════════════════════════════════════
//  ЭКРАНЫ
// ═══════════════════════════════════════════
function drawCatPreview(cx, cy, scale, t) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(scale, scale);
  ctx.translate(5, 0);
  drawCatBody(t, false, false);
  ctx.restore();
}

function drawStartScreen() {
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(0, 0, W, H);

  // Кот-превью сверху
  const scale = Math.min(W / 380, 1.4);
  drawCatPreview(W/2, H * 0.32 + 40 * scale, scale, G.t);

  ctx.textAlign = 'center';
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 40px -apple-system, sans-serif';
  ctx.fillText('КАПТЕР', W/2, H * 0.45);

  ctx.font = 'bold 24px -apple-system, sans-serif';
  ctx.fillStyle = '#ffb37a';
  ctx.fillText('9 ЖИЗНЕЙ', W/2, H * 0.5);

  ctx.font = '16px -apple-system, sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.fillText('ТАП — прыжок / двойной прыжок', W/2, H * 0.58);
  ctx.fillText('СВАЙП ВНИЗ — подкат', W/2, H * 0.62);
  ctx.fillText('Собирай 🐟, уворачивайся!', W/2, H * 0.665);

  const pulse = 1 + Math.sin(G.t * 0.1) * 0.05;
  ctx.save();
  ctx.translate(W/2, H * 0.80);
  ctx.scale(pulse, pulse);
  ctx.fillStyle = '#ffb37a';
  roundRect(ctx, -110, -28, 220, 56, 28); ctx.fill();
  ctx.fillStyle = '#2a1f3d';
  ctx.font = 'bold 20px -apple-system, sans-serif';
  ctx.fillText('ТАПНИ ЧТОБЫ НАЧАТЬ', 0, 7);
  ctx.restore();
  ctx.textAlign = 'left';
}

function drawGameOver() {
  ctx.fillStyle = 'rgba(0,0,0,0.65)';
  ctx.fillRect(0, 0, W, H);

  const scale = Math.min(W / 500, 1.0);
  drawCatPreview(W/2, H * 0.28 + 40 * scale, scale, G.t);

  ctx.textAlign = 'center';
  ctx.fillStyle = '#ff5a5a';
  ctx.font = 'bold 34px -apple-system, sans-serif';
  ctx.fillText('КАПТЕР УСТАЛ', W/2, H * 0.42);

  ctx.fillStyle = '#fff';
  ctx.font = 'bold 18px -apple-system, sans-serif';
  ctx.fillText('Все 9 жизней истрачены', W/2, H * 0.475);

  ctx.fillStyle = '#ffb37a';
  ctx.font = 'bold 34px -apple-system, sans-serif';
  ctx.fillText(String(G.score), W/2, H * 0.56);

  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.font = '14px -apple-system, sans-serif';
  ctx.fillText('ОЧКОВ', W/2, H * 0.60);

  const pulse = 1 + Math.sin(G.t * 0.12) * 0.05;
  ctx.save();
  ctx.translate(W/2, H * 0.78);
  ctx.scale(pulse, pulse);
  ctx.fillStyle = '#ffb37a';
  roundRect(ctx, -110, -28, 220, 56, 28); ctx.fill();
  ctx.fillStyle = '#2a1f3d';
  ctx.font = 'bold 20px -apple-system, sans-serif';
  ctx.fillText('ЕЩЁ РАЗ', 0, 7);
  ctx.restore();
  ctx.textAlign = 'left';
}

// ═══════════════════════════════════════════
//  ГЛАВНЫЙ РЕНДЕР
// ═══════════════════════════════════════════
function render() {
  ctx.save();
  if (G.shake > 0) {
    const s = G.shake;
    ctx.translate((Math.random()-0.5)*s, (Math.random()-0.5)*s);
  }

  drawBackground();
  drawGround();

  for (const it of G.items) drawFish(it);
  for (const o of G.obstacles) drawObstacle(o);

  if (G.started && !G.dead) drawCat();

  drawParticles();
  ctx.restore();

  if (!G.started) drawStartScreen();
  if (G.dead)     drawGameOver();
}

// ═══════════════════════════════════════════
//  ЦИКЛ
// ═══════════════════════════════════════════
let lastT = performance.now();
function loop(now) {
  const dt = Math.min((now - lastT) / 16.667, 2.5);
  lastT = now;
  update(dt);
  render();
  requestAnimationFrame(loop);
}

cat.x = Math.max(100, W * 0.22);
cat.y = groundY;
updateHUD();
drawAvatar();
requestAnimationFrame(loop);

})();
</script>
